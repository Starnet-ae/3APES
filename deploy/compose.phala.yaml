services:
  router:
    image: ghcr.io/starnet-ae/3apes:sha-094599b703b1d4da2742077df6b59b9fbcdf0211

    restart: unless-stopped

    ports:
      - '8080:8080'

    environment:
      BIND_ADDRESS: '0.0.0.0:8080'
      SQLITE_PATH: '/data/3apes.db'

      PUBLIC_ORIGIN: 'https://3apes.ai'
      SIGNUP_ENABLED: '${SIGNUP_ENABLED:-false}'

      LLM_BASE_URL: 'https://inference.phala.com/v1'
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY must be set}
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-https://3apes.ai}"

      MODEL_SMALL_ID: ''
      MODEL_MEDIUM_ID: 'deepseek/deepseek-v3.2'
      MODEL_LARGE_ID: ''

    volumes:
      - sqlite_data:/data

volumes:
  sqlite_data:
    name: 3apes_sqlite_data
